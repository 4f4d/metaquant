# SPDX-License-Identifier: Apache-2.0
name: CodeQL

on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }
  schedule: [{ cron: "0 6 * * 1" }] # weekly

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
        # Rust is not yet in the CodeQL default set; analyze Python/JS now; add Rust via third-party queries if desired later.
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v3
        with: { category: "/language:${{ matrix.language }}" }
    # For private advisories, CodeQL results appear under Security → Code scanning.
