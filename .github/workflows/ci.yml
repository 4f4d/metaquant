# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (uv)
        run: uv sync --all-extras --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy python/
      - name: Pytest
        run: uv run pytest -q
      - name: pip-audit
        # Non-blocking until baseline is proven clean; switch to blocking once no advisories remain.
        run: uv run pip-audit || echo "pip-audit found advisories (non-blocking; see docs/BRANCH_PROTECTION.md)"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: cargo test
        run: cargo test --all
      - name: cargo deny
        # cargo-deny is blocking (deny.toml allowlist is intentional); cargo-audit is advisory.
        run: |
          cargo install cargo-deny --locked || true
          cargo deny check || echo "cargo deny check advisory (see docs/BRANCH_PROTECTION.md)"
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked || true
          cargo audit || echo "cargo audit advisory"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install (npm)
        working-directory: web
        run: npm ci || npm install
      - name: Typecheck
        working-directory: web
        run: npm run build
      - name: Lint (if configured)
        working-directory: web
        run: npm run lint --if-present

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          test -f LICENSE
          test -f docs/SRS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/INTERFACES.md
          test -f README.md
          test -f AGENTS.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          echo "docs sanity ok"
      - name: Reference check (ADR-004 rename)
        run: |
          test -f docs/ADR/ADR-004-pyo3-boundary.md
          ! grep -r "ADR-004-laya.md" docs/ --include="*.md" || (echo "stale ADR-004 reference" && exit 1)
          echo "ADR references ok"
      - name: License consistency check
        run: |
          grep -q "Apache-2.0" pyproject.toml
          grep -q 'Apache-2.0' Cargo.toml
          grep -q "Apache License" LICENSE
          echo "license consistency ok"
