[project]
name = "meta-quant"
version = "0.1.0"
description = "META QUANT — multi-horizon relative-value research & trading platform (research/ML/analytics plane)"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
authors = [{ name = "META QUANT" }]
keywords = ["quant", "trading", "research", "india", "nse", "bse"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "numpy>=1.26,<2.6",
    "scipy>=1.12",
    "pandas>=2.2",  # interop only where required; primary is polars
    "polars>=1.10",
    "pyarrow>=15",
    "duckdb>=1.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "xgboost>=2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "tomli>=2.0; python_version < '3.11'",
    "python-dotenv>=1.0",
    "structlog>=24",
    "typer>=0.12",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.3"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/metaquant/metaquant"
Documentation = "docs/README.md"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "target", "web/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests", ".venv", "target"]

[[tool.mypy.overrides]]
module = "xgboost.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "services/api"]
addopts = "-q --strict-markers"
markers = [
    "slow: slow integration/replay tests",
    "property: Hypothesis property tests",
]

[tool.coverage.run]
source = ["python/meta_quant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
